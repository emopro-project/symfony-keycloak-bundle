services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: public

  KeycloakAuthBundle\:
    resource: "../../"
    exclude:
      - "../../{DependencyInjection, Resources}"
      - "../../Domain/Model"
      - "../../Infrastructure/Symfony/Models"

  # Port → Adapter (hexagonal)
  KeycloakAuthBundle\Domain\Port\JwksProviderInterface:
    alias: KeycloakAuthBundle\Infrastructure\Keycloak\JwksProvider

  KeycloakAuthBundle\Domain\Port\TokenExchangerInterface:
    alias: KeycloakAuthBundle\Infrastructure\Keycloak\TokenExchanger

  KeycloakAuthBundle\Infrastructure\Keycloak\JwksProvider:
    arguments:
      $httpClient: "@http_client"
      $jwksUrl: "%keycloak.jwks_url%"

  # UseCase service
  KeycloakAuthBundle\Application\UseCase\AuthenticateUser: ~

  "@keycloak_authenticator":
    alias: KeycloakAuthBundle\Infrastructure\Symfony\Security\KeycloakAuthenticator
  "@Symfony_user_provider":
    alias: KeycloakAuthBundle\Infrastructure\Symfony\Provider\SymfonyUserProvider

  # Authenticator service
  KeycloakAuthBundle\Infrastructure\Symfony\Security\KeycloakAuthenticator:
    arguments:
      $authenticateUser: '@KeycloakAuthBundle\Application\UseCase\AuthenticateUser'
    tags:
      - { name: "security.authenticator" }

  KeycloakAuthBundle\Infrastructure\Keycloak\LoginUrlGenerator:
    arguments:
      $baseUrl: "%keycloak.base_url%"
      $realm: "%keycloak.realm%"
      $clientId: "%keycloak.client_id%"
      $redirectUri: "%keycloak.redirect_uri%"

  KeycloakAuthBundle\Infrastructure\Keycloak\KeycloakEndpoints:
    arguments:
      $baseUrl: "%keycloak.base_url%"
      $realm: "%keycloak.realm%"

  KeycloakAuthBundle\Infrastructure\Keycloak\TokenExchanger:
    arguments:
      $clientId: "%keycloak.client_id%"
      $redirectUri: "%keycloak.redirect_uri%"
      $clientSecret: "%keycloak.client_secret%"

  KeycloakAuthBundle\Infrastructure\Keycloak\ClientCredentialsTokenProvider:
    arguments:
      $clientId: "%keycloak.client_id%"
      $clientSecret: "%keycloak.client_secret%"

  KeycloakAuthBundle\Infrastructure\Keycloak\IssuerChecker:
    arguments:
      $baseUrl: "%keycloak.base_url%"
      $realm: "%keycloak.realm%"

  KeycloakAuthBundle\Domain\Port\HealthCheckInterface:
    alias: KeycloakAuthBundle\Infrastructure\Keycloak\KeyCloackHealthChecker


  KeycloakAuthBundle\Infrastructure\Keycloak\Jwt\LcobucciJwtValidator:
    arguments:
        $jwtConfig: '@Lcobucci\JWT\Configuration' # ou ton service Configuration
        $jwksProvider: '@KeycloakAuthBundle\Infrastructure\Keycloak\JwksProvider'
        $roleMapper  : '@KeycloakAuthBundle\Infrastructure\Keycloak\RoleMapper'
        $issuer      : "%keycloak.issuer%"

  KeycloakAuthBundle\Domain\Port\RoleMapperInterface:
    alias: KeycloakAuthBundle\Infrastructure\Keycloak\RoleMapper


 # Keys (placeholder, la vraie clé vient du JWKS)
  Lcobucci\JWT\Signer\Key\InMemory:
    factory: ['Lcobucci\JWT\Signer\Key\InMemory', 'empty']

  Lcobucci\JWT\Signer\Rsa\Sha256:
    class: Lcobucci\JWT\Signer\Rsa\Sha256
 
  Lcobucci\JWT\Configuration:
    factory: ['Lcobucci\JWT\Configuration', 'forAsymmetricSigner']
    arguments:
      - '@Lcobucci\JWT\Signer\Rsa\Sha256'
      - '@Lcobucci\JWT\Signer\Key\InMemory'
      - '@Lcobucci\JWT\Signer\Key\InMemory'